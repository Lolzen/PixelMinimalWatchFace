// Watch Face Format (WFF) version of the watch face, for Wear OS 5 and newer.
// The watch face is defined in src/<flavor>/res/raw/watchface.xml, generated by generate_watchface.py.
// WFF watch faces can't contain code, so Kotlin is disabled and nothing but resources are packaged.
plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace = 'com.benoitletondor.pixelminimalwatchface.wff'
    compileSdk = 37
    enableKotlin = false

    defaultConfig {
        // Watch Face Format version 2 (weather data) requires Wear OS 5 (API 34)
        minSdk = 34
        targetSdk = 36
        versionCode = 3
        versionName = "2.5.2"
    }

    flavorDimensions = ['style']
    productFlavors {
        regular {
            dimension = 'style'
            applicationId = "com.benoitletondor.pixelminimalwatchface.wff"
        }
        android12 {
            dimension = 'style'
            applicationId = "com.benoitletondor.pixelminimalwatchface.wff.android12"
        }
    }

    buildTypes {
        debug {
            // Removes the empty dex file, WFF packages must not contain code
            minifyEnabled = true
        }
        release {
            minifyEnabled = true
            // Resources are only referenced from the watch face XML, they must not be removed
            shrinkResources = false
        }
    }
}
