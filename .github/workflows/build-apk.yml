name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: watchface-debug-apk
          path: android/watchface/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: companionapp-debug-apk
          path: android/companionapp/build/outputs/apk/debug/*.apk
