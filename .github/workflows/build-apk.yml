name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check that the generated WFF watch faces are up to date
        run: |
          WFF_SKIP_PREVIEWS=1 python3 watchface-wff/generate_watchface.py
          git diff --exit-code -- watchface-wff

      - name: Validate WFF watch faces against the Watch Face Format schema
        run: |
          pip install xmlschema
          git clone --depth 1 https://github.com/google/watchface.git "$RUNNER_TEMP/watchface"
          python3 watchface-wff/validate_watchface.py "$RUNNER_TEMP/watchface/third_party/wff/specification/documents" 2 watchface-wff/src/*/res/raw/watchface.xml

      - name: Build debug APKs
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: watchface-debug-apk
          path: android/watchface/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: watchface-wff-debug-apks
          path: android/watchface-wff/build/outputs/apk/*/debug/*.apk
